[package]
name = "virtkey"
version = "0.1.0"
edition = "2024"
description = "Windows virtual USB FIDO authenticator prototype"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
